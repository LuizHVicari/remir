name: publish

# Publishes the server image to GHCR and deploys it to the Docker host over SSH (blue-green behind Traefik,
# see deploy/deploy.sh).
# Pull requests are validated by pr.yml and publish nothing.
#
#   push to dev    -> image <next minor>-dev.<sha> (e.g. 1.5.0-dev.a1b2c3d) -> "dev" environment
#   tag v1.4.0     -> image 1.4.0 and latest, tag must be on main          -> "prod" environment
#
# A push to main without a tag publishes nothing. Variables and secrets are listed in the README ("Deploy").
on:
  push:
    branches: [dev]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # A newer push to dev replaces a running dev publish; a release is never cancelled.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The server tests start Postgres with Testcontainers; the runner has Docker.
      - run: ./gradlew :core:test :server:test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      environment: ${{ steps.version.outputs.environment }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and branch history are needed to compute the version

      - name: Compute version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          sha7="${GITHUB_SHA::7}"
          repo="ghcr.io/${OWNER,,}/remir-server"
          if [ "$REF_TYPE" = "tag" ]; then
            # A release must come from main, so an arbitrary branch cannot ship to production.
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::Tag $REF_NAME is not on main"; exit 1; }
            version="${REF_NAME#v}"
            tags="${repo}:${version}"$'\n'"${repo}:latest"
            environment="prod"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              next="0.1.0"
            else
              IFS=. read -r major minor _ <<< "${latest#v}"
              next="${major}.$((minor + 1)).0"
            fi
            version="${next}-dev.${sha7}"
            tags="${repo}:${version}"
            environment="dev"
          fi
          {
            echo "environment=$environment"
            echo "image=${repo}:${version}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${repo}:${version} to the ${environment} environment"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          # Links the package to this repository, so it inherits the repository's permissions.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # Each environment (dev, prod) holds its own database settings and secrets.
    environment: ${{ needs.publish.outputs.environment }}
    permissions:
      contents: read
      packages: read # the token below is used on the server to pull the image
    env:
      ENVIRONMENT: ${{ needs.publish.outputs.environment }}
      IMAGE: ${{ needs.publish.outputs.image }}
      # Secrets, not variables: this repository is public, and secrets are masked in the public logs.
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned, so the first connection is not trusted blindly.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Send application settings
        env:
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
          DATABASE_PORT: ${{ vars.DATABASE_PORT || '5432' }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          DATABASE_USER: ${{ vars.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_POOL_SIZE: ${{ vars.DATABASE_POOL_SIZE || '3' }}
          CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
        run: |
          set -euo pipefail
          # Written to a file readable by root only; the secrets never appear in a command line.
          {
            echo "PORT=8080"
            echo "DATABASE_HOST=$DATABASE_HOST"
            echo "DATABASE_PORT=$DATABASE_PORT"
            echo "DATABASE_NAME=$DATABASE_NAME"
            echo "DATABASE_USER=$DATABASE_USER"
            echo "DATABASE_PASSWORD=$DATABASE_PASSWORD"
            echo "DATABASE_SSLMODE=require"
            echo "DATABASE_POOL_SIZE=$DATABASE_POOL_SIZE"
            echo "CLERK_ISSUER=$CLERK_ISSUER"
          } | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$TARGET" \
            "umask 077 && mkdir -p /opt/remir && cat > /opt/remir/${ENVIRONMENT}.env"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN: ${{ vars.DOMAIN }}
          # Empty behind Cloudflare's proxy; `le` when the record is DNS only (see the README).
          CERT_RESOLVER: ${{ vars.CERT_RESOLVER }}
          MEMORY: ${{ vars.CONTAINER_MEMORY || '448m' }}
        run: |
          set -euo pipefail
          # The token travels on stdin, ahead of the script, so it never appears in a process list.
          {
            printf 'export ENVIRONMENT=%q IMAGE=%q ENV_FILE=%q DOMAIN=%q CERT_RESOLVER=%q MEMORY=%q\n' \
              "$ENVIRONMENT" "$IMAGE" "/opt/remir/${ENVIRONMENT}.env" "$DOMAIN" "$CERT_RESOLVER" "$MEMORY"
            printf 'export GHCR_USER=%q GHCR_TOKEN=%q\n' "$GITHUB_ACTOR" "$GHCR_TOKEN"
            cat deploy/deploy.sh
          } | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$TARGET" bash -s
