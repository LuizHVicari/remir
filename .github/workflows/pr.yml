name: pr

# Validates pull requests into dev and main. Nothing is published here: no image, no deploy.
# Every check runs in parallel; the reusable workflows (_*.yml) hold the actual steps.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  test:
    uses: ./.github/workflows/_test.yml

  android:
    uses: ./.github/workflows/_android.yml

  docker:
    # Builds without pushing, so a broken Dockerfile is caught before it reaches dev or main.
    uses: ./.github/workflows/_docker.yml
    with:
      push: false
