name: _docker

# Builds the server image. With `push: false` it only proves that the Dockerfile builds; with `push: true` it
# logs in to GHCR and publishes `tags`. Permissions come from the caller (`packages: write` is needed to push).
on:
  workflow_call:
    inputs:
      push:
        description: Publish the image to GHCR
        type: boolean
        default: false
      tags:
        description: Image tags to publish, one per line (ignored when push is false)
        type: string
        default: ''

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          # Links the package to this repository, so it inherits the repository's permissions.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
