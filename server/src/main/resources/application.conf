ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ dev.luizhenriquevicari.remir.server.ApplicationKt.module ]
    }
}

# Everything comes from environment variables (see .env.example).
# For local dev, `./gradlew :server:run` loads them from the root .env file.
database {
    host = ${?DATABASE_HOST}
    port = ${?DATABASE_PORT}
    name = ${?DATABASE_NAME}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
    # Optional. `require` for a managed Postgres such as Neon; leave unset locally.
    sslmode = ${?DATABASE_SSLMODE}
    # Optional. Max connections per instance (default 10).
    poolSize = ${?DATABASE_POOL_SIZE}
}

clerk {
    # Frontend API URL of the Clerk instance, e.g. https://your-app.clerk.accounts.dev
    issuer = ""
    issuer = ${?CLERK_ISSUER}
}
